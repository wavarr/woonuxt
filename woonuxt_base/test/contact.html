<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ModaPrime USA</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-left">
                <a href="index.html" class="brand-logo">ModaPrime USA</a>
                <a href="index.html">Shop</a>
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="nav-right">
                <button id="darkModeToggle">🌙</button>
                <a href="login.html" class="btn btn-login">Login</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <h1>Contact Us</h1>
        <p>Have questions? Fill out the form below, and we'll get back to you as soon as possible.</p>

        <div class="contact-info">
            
             <p><strong>Email:</strong> support@modaprimeusa.com (Replace with actual)</p>
        </div>

        <form class="contact-form" action="#" method="POST"> <!-- Needs backend endpoint in 'action' -->
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </main>

    <footer>
        <p>© 2023 ModaPrime USA. All rights reserved.</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
